# Reference deployment: app + postgres + redis.
#
# The reference app itself runs on SQLite (zero-config). Postgres and Redis
# are provisioned here as the production topology so the hardening path in
# server/PRODUCTION.md is one step, not a redesign: point DATABASE_URL at
# the `db` service and implement the Database interface against it, and
# point the rate limiter / pairing store at `cache`.
#
#   cp .env.example .env   # then fill in secrets
#   docker compose up --build
#
# The server is then live at http://localhost:8080 (see server/README.md).

services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "${JADE_SERVER_PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      JADE_SERVER_HOST: "0.0.0.0"
      JADE_DATA_DIR: /data
    volumes:
      - server-data:/data
    depends_on:
      db:
        condition: service_started
      cache:
        condition: service_started
    restart: unless-stopped

  # Provisioned for the production hardening path (PRODUCTION.md).
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-jade}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me-in-.env}"
      POSTGRES_DB: "${POSTGRES_DB:-jade}"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me-in-.env}"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  server-data:
  pg-data:
  redis-data:
